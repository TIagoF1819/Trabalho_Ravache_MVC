<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>
</head>
<body>
<h1>Livros cadastrados</h1>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="livro : ${livros}">
        <td th:text="${livro.titulo}"></td>
        <td th:text="${livro.autor}"></td>
        <td th:text="${livro.isbn}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
