<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca - Livros</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; color: #222; }
        header { background: #2c3e50; color: #fff; padding: 20px 40px; }
        header h1 { margin: 0; font-size: 24px; }
        main { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .topo h2 { margin: 0; }
        .btn { display: inline-block; padding: 10px 18px; background: #27ae60; color: #fff;
            text-decoration: none; border-radius: 6px; font-size: 14px; }
        .btn:hover { background: #219150; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px;
            overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        th, td { padding: 12px 16px; text-align: left; }
        th { background: #34495e; color: #fff; }
        tr:nth-child(even) { background: #f9f9f9; }
        .vazio { text-align: center; padding: 30px; color: #777; }
        .total { margin-top: 12px; color: #555; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h1>📚 Biblioteca</h1>
</header>

<main>
    <div class="topo">
        <h2>Livros cadastrados</h2>
        <a class="btn" th:href="@{/livros/novo}">+ Novo livro</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="livro : ${livros}">
            <td th:text="${livro.titulo}"></td>
            <td th:text="${livro.autor}"></td>
            <td th:text="${livro.isbn}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(livros)}">
            <td colspan="3" class="vazio">Nenhum livro cadastrado ainda.</td>
        </tr>
        </tbody>
    </table>

    <p class="total" th:text="'Total: ' + ${#lists.size(livros)} + ' livro(s)'"></p>
</main>

</body>
</html>
